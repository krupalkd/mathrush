<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- Math Symbol Decorators in Background -->
  <text x="70" y="140" font-family="sans-serif" font-weight="900" font-size="64" fill="#6366f1" fill-opacity="0.25">+</text>
  <text x="410" y="140" font-family="sans-serif" font-weight="900" font-size="64" fill="#6366f1" fill-opacity="0.25">×</text>
  <text x="80" y="420" font-family="sans-serif" font-weight="900" font-size="64" fill="#6366f1" fill-opacity="0.25">÷</text>
  <text x="400" y="420" font-family="sans-serif" font-weight="900" font-size="64" fill="#6366f1" fill-opacity="0.25">=</text>

  <!-- Central Glowing Math Lightning Bolt -->
  <path d="M 285 64 L 160 272 L 256 272 L 227 448 L 352 240 L 256 240 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)" />
</svg>
